<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaDex - Guia de Estudo de Java</title>
<style>
:root {
  --bg: #f6f7f8;
  --panel: #ffffff;
  --panel-2: #fbfbfc;
  --ink: #17191c;
  --muted: #667085;
  --soft: #e5e7eb;
  --soft-2: #f1f3f5;
  --brand: #c2410c;
  --brand-2: #1d4ed8;
  --good: #15803d;
  --bad: #b91c1c;
  --warn: #a16207;
  --code: #111827;
  --code-2: #0b1220;
  --topbar: rgba(255,255,255,.96);
  --nav-ink: #374151;
  --active-bg: #fff7ed;
  --hero-bg: linear-gradient(180deg, #fff, #fbfbfc);
  --tile-bg: #fff;
  --text-block: #28313f;
  --tag-ink: #475467;
  --meter-bg: #e5e7eb;
  --inline-code-bg: #eef2f7;
  --inline-code-ink: #0f3a73;
  --blue-soft: #eff6ff;
  --blue-ink: #1e3a8a;
  --blue-border: #bfdbfe;
  --warn-soft: #fffbeb;
  --warn-ink: #713f12;
  --warn-border: #fde68a;
  --good-soft: #f0fdf4;
  --good-ink: #14532d;
  --good-border: #bbf7d0;
  --bad-soft: #fef2f2;
  --bad-border: #fecaca;
  --shadow: 0 12px 28px rgba(15, 23, 42, .08);
  --radius: 8px;
  --mono: "Cascadia Code", "Consolas", "SFMono-Regular", monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --side: 292px;
}

:root[data-theme="dark"] {
  --bg: #101418;
  --panel: #171d23;
  --panel-2: #1d242c;
  --ink: #eef2f6;
  --muted: #a7b0bd;
  --soft: #2b3440;
  --soft-2: #242c35;
  --brand: #f97316;
  --brand-2: #60a5fa;
  --good: #4ade80;
  --bad: #f87171;
  --warn: #facc15;
  --code: #0b1117;
  --code-2: #070b10;
  --topbar: rgba(23,29,35,.96);
  --nav-ink: #d9e0ea;
  --active-bg: #321f14;
  --hero-bg: linear-gradient(180deg, #1b222a, #171d23);
  --tile-bg: #171d23;
  --text-block: #dce3eb;
  --tag-ink: #c7d0dc;
  --meter-bg: #313b47;
  --inline-code-bg: #263241;
  --inline-code-ink: #bfdbfe;
  --blue-soft: #17283f;
  --blue-ink: #bfdbfe;
  --blue-border: #31517a;
  --warn-soft: #332a13;
  --warn-ink: #fde68a;
  --warn-border: #70551b;
  --good-soft: #12301f;
  --good-ink: #bbf7d0;
  --good-border: #2f6846;
  --bad-soft: #35191d;
  --bad-border: #7f2a32;
  --shadow: 0 16px 34px rgba(0, 0, 0, .32);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.55;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea, select { background: var(--panel); color: var(--ink); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 58px;
  border-bottom: 1px solid var(--soft);
  background: var(--topbar);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
}

.menu-btn {
  display: none;
  width: 38px;
  height: 38px;
  border: 1px solid var(--soft);
  background: var(--panel);
  border-radius: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 190px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--brand);
  color: white;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
}

.brand strong { display: block; line-height: 1.05; }
.brand span { color: var(--muted); font-size: .77rem; }

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress-chip {
  border: 1px solid var(--soft);
  background: var(--panel);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: .82rem;
  white-space: nowrap;
}

.search {
  width: min(360px, 36vw);
  border: 1px solid var(--soft);
  background: var(--panel);
  border-radius: 8px;
  padding: 9px 12px;
  outline: none;
}
.search::placeholder, textarea::placeholder { color: var(--muted); }
.search:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }

.shell { display: flex; min-height: calc(100vh - 58px); }

.sidebar {
  width: var(--side);
  flex: 0 0 var(--side);
  border-right: 1px solid var(--soft);
  background: var(--panel);
  padding: 16px 12px 24px;
  position: sticky;
  top: 58px;
  height: calc(100vh - 58px);
  overflow-y: auto;
}

.side-title {
  padding: 8px 10px;
  font-size: .74rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  font-weight: 800;
}

.nav-item {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--nav-ink);
  padding: 9px 10px;
  border-radius: 8px;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}
.nav-item:hover { background: var(--soft-2); }
.nav-item.active { background: var(--active-bg); color: var(--brand); font-weight: 800; }
.nav-item.done::after { content: "feito"; color: var(--good); font-size: .72rem; font-weight: 800; }
.nav-item small { color: var(--muted); font-family: var(--mono); }

.content {
  width: 100%;
  padding: 28px;
}

.study-grid {
  max-width: 1240px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 22px;
  align-items: start;
}

.main-panel, .study-card, .lesson-card, .quiz-card, .exercise-card {
  background: var(--panel);
  border: 1px solid var(--soft);
  border-radius: var(--radius);
  box-shadow: 0 1px 2px rgba(15,23,42,.04);
}

.main-panel { overflow: hidden; }

.hero {
  padding: 26px 28px;
  border-bottom: 1px solid var(--soft);
  background: var(--hero-bg);
}

.kicker {
  color: var(--brand);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: .72rem;
  margin-bottom: 8px;
}

h1, h2, h3 { line-height: 1.18; margin: 0; letter-spacing: 0; }
h1 { font-size: clamp(1.75rem, 2.8vw, 2.5rem); }
h2 { font-size: 1.35rem; margin-bottom: 12px; }
h3 { font-size: 1.05rem; margin-bottom: 8px; }
p { margin: 0 0 12px; }

.hero p {
  color: var(--muted);
  max-width: 780px;
  margin-top: 10px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.btn {
  border: 1px solid var(--soft);
  background: var(--panel);
  color: var(--ink);
  padding: 9px 13px;
  border-radius: 8px;
  font-weight: 800;
  text-decoration: none;
}
.btn:hover { border-color: var(--brand-2); color: var(--brand-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.ghost { background: transparent; }

.section { padding: 24px 28px; border-bottom: 1px solid var(--soft); }
.section:last-child { border-bottom: 0; }

.module-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.module-card {
  border: 1px solid var(--soft);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 15px;
  min-height: 132px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.module-card strong { font-size: .95rem; }
.module-card span { color: var(--muted); font-size: .84rem; }
.meter { height: 6px; background: var(--meter-bg); border-radius: 999px; overflow: hidden; margin-top: auto; }
.meter > i { display: block; height: 100%; background: var(--good); width: 0; }

.phase-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.phase-card {
  border: 1px solid var(--soft);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 14px;
}
.phase-card small {
  display: block;
  color: var(--brand);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 7px;
}
.phase-card strong { display: block; margin-bottom: 6px; }
.phase-card p { color: var(--muted); font-size: .88rem; margin: 0; }

.lesson-card { padding: 24px 28px; }
.lesson-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.tag {
  border: 1px solid var(--soft);
  background: var(--soft-2);
  color: var(--tag-ink);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: .74rem;
  font-weight: 800;
}
.tag.exam { background: var(--blue-soft); color: var(--brand-2); border-color: var(--blue-border); }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-border); }
.tag.good { background: var(--good-soft); color: var(--good); border-color: var(--good-border); }

.lesson-body {
  display: grid;
  gap: 14px;
}

.lesson-intro {
  border: 1px solid var(--soft);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 14px;
  margin-top: 16px;
}
.lesson-intro strong { display: block; margin-bottom: 8px; }
.lesson-map {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.lesson-map li {
  border: 1px solid var(--soft);
  background: var(--tile-bg);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text-block);
  font-size: .86rem;
  font-weight: 700;
}

.lesson-section {
  border: 1px solid var(--soft);
  border-radius: 8px;
  background: var(--tile-bg);
  overflow: hidden;
}
.lesson-section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--soft);
  background: var(--panel-2);
}
.lesson-section-num {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--blue-soft);
  color: var(--brand-2);
  font-weight: 900;
  font-size: .82rem;
}
.lesson-section-title { font-weight: 900; }
.lesson-section-desc {
  color: var(--muted);
  font-size: .84rem;
}
.lesson-section-body { padding: 16px; }
.lesson-section-body > :last-child { margin-bottom: 0; }

.text-block {
  color: var(--text-block);
  font-size: .98rem;
}
.text-block ul, .text-block ol { margin: 10px 0 0 22px; padding: 0; }
.text-block li { margin: 6px 0; }

.callout {
  border: 1px solid var(--blue-border);
  background: var(--blue-soft);
  color: var(--blue-ink);
  border-radius: 8px;
  padding: 13px 14px;
}
.callout.warn { border-color: var(--warn-border); background: var(--warn-soft); color: var(--warn-ink); }
.callout.good { border-color: var(--good-border); background: var(--good-soft); color: var(--good-ink); }

code {
  font-family: var(--mono);
  background: var(--inline-code-bg);
  color: var(--inline-code-ink);
  border-radius: 5px;
  padding: 1px 5px;
  font-size: .88em;
}

.codebox {
  background: var(--code);
  color: #dbeafe;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #263244;
}
.code-head {
  background: var(--code-2);
  color: #93a4b8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: .76rem;
}
.code-head button {
  border: 1px solid #334155;
  color: #cbd5e1;
  background: transparent;
  border-radius: 6px;
  padding: 4px 8px;
}
pre {
  margin: 0;
  padding: 16px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: .88rem;
  line-height: 1.6;
  tab-size: 4;
}

.compare {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
  border: 1px solid var(--soft);
  border-radius: 8px;
  font-size: .9rem;
}
.compare th, .compare td { padding: 10px 12px; border-bottom: 1px solid var(--soft); text-align: left; vertical-align: top; }
.compare th { background: var(--soft-2); }
.compare tr:last-child td { border-bottom: 0; }

.lesson-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
}

.quiz-card, .exercise-card { padding: 18px; }
.lesson-section .quiz-card,
.lesson-section .exercise-card {
  border: 0;
  box-shadow: none;
  padding: 0;
  background: transparent;
}
.quiz-options { display: grid; gap: 8px; margin-top: 12px; }
.option {
  width: 100%;
  text-align: left;
  border: 1px solid var(--soft);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 10px 12px;
}
.option.correct { border-color: var(--good-border); background: var(--good-soft); color: var(--good); }
.option.wrong { border-color: var(--bad-border); background: var(--bad-soft); color: var(--bad); }
.feedback { margin-top: 10px; color: var(--muted); font-size: .92rem; }

.exercise-card textarea, .notes textarea {
  width: 100%;
  min-height: 160px;
  border: 1px solid var(--soft);
  border-radius: 8px;
  padding: 12px;
  resize: vertical;
  font-family: var(--mono);
  outline: none;
}
.exercise-card textarea:focus, .notes textarea:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
.exercise-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.result { margin-top: 10px; padding: 10px 12px; border-radius: 8px; display: none; }
.result.show { display: block; }
.result.hint { background: var(--blue-soft); color: var(--blue-ink); border: 1px solid var(--blue-border); }
.result.ok { background: var(--good-soft); color: var(--good); border: 1px solid var(--good-border); }
.result.no { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }

.right-col { display: grid; gap: 14px; position: sticky; top: 78px; }
.study-card { padding: 16px; }
.study-card h3 { margin-bottom: 10px; }
.compact-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.compact-list li {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  color: var(--nav-ink);
  font-size: .9rem;
}
.compact-list input { margin-top: 3px; }

.flashcard {
  border: 1px solid var(--soft);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 14px;
  min-height: 145px;
}
.flashcard strong { display: block; margin-bottom: 8px; }
.flash-answer { display: none; color: var(--text-block); }
.flashcard.reveal .flash-answer { display: block; }

.hidden { display: none !important; }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--soft); border-radius: 8px; }

@media (max-width: 1040px) {
  .study-grid { grid-template-columns: 1fr; }
  .right-col { position: static; }
  .module-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .phase-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 760px) {
  .menu-btn { display: block; }
  .search { display: none; }
  .sidebar {
    position: fixed;
    top: 58px;
    left: 0;
    transform: translateX(-105%);
    z-index: 30;
    box-shadow: var(--shadow);
    transition: transform .18s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .content { padding: 16px; }
  .hero, .section, .lesson-card { padding: 20px; }
  .module-grid { grid-template-columns: 1fr; }
  .phase-grid, .lesson-map { grid-template-columns: 1fr; }
  .top-actions { gap: 6px; }
  .top-actions .btn { width: auto; padding: 8px 10px; }
  .progress-chip { display: none; }
  .lesson-nav { flex-direction: column; }
  .btn { width: 100%; text-align: center; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">&#9776;</button>
  <div class="brand" role="button" tabindex="0" onclick="showDashboard()">
    <div class="brand-mark" role="button" tabindex="0" onclick="showDashboard()">JDX</div>
    <div>
      <strong>JavaDex</strong>
      <span>guia para passar à cadeira</span>
    </div>
  </div>
  <input class="search" id="search" placeholder="Pesquisar: herança, arrays, exceções..." autocomplete="off">
  <div class="top-actions">
    <span class="progress-chip" id="progressChip">0% concluído</span>
    <button class="btn ghost" id="themeBtn" type="button" onclick="toggleTheme()">Modo escuro</button>
    <button class="btn ghost" onclick="resetProgress()">Limpar progresso</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="study-grid">
      <div class="main-panel" id="main"></div>
      <aside class="right-col">
        <section class="study-card">
          <h3>Checklist de exame</h3>
          <ul class="compact-list" id="examChecklist"></ul>
        </section>
        <section class="study-card">
          <h3>Flashcard rápido</h3>
          <div class="flashcard" id="flashcard"></div>
          <div class="exercise-actions">
            <button class="btn" onclick="revealFlash()">Ver resposta</button>
            <button class="btn" onclick="nextFlash()">Outro</button>
          </div>
        </section>
        <section class="study-card notes">
          <h3>As minhas notas</h3>
          <textarea id="notes" placeholder="Aponta dúvidas, erros que repetes e mini-resumos..."></textarea>
        </section>
      </aside>
    </div>
  </main>
</div>

<script>
const savedTheme = localStorage.getItem("javadex-theme") || "light";
document.documentElement.dataset.theme = savedTheme;

const lessons = [
  {
    id: "plano",
    module: "Começar bem",
    title: "Como estudar Java para passar",
    level: "base",
    minutes: 12,
    exam: true,
    summary: "Método de estudo, ambiente, compilação e o que normalmente sai numa cadeira de Java.",
    body: [
      {type:"text", html: `
        <p>Para estudar Java bem, usa sempre este ciclo: <strong>ler a ideia</strong>, <strong>ver um exemplo pequeno</strong>, <strong>alterar o exemplo</strong> e <strong>resolver um exercício sem olhar</strong>. Java aprende-se a escrever, não só a ler.</p>
        <ul>
          <li><strong>Compilar:</strong> <code>javac Main.java</code> transforma código fonte em bytecode.</li>
          <li><strong>Executar:</strong> <code>java Main</code> corre a classé que tem <code>public static void main(String[] args)</code>.</li>
          <li><strong>IDE:</strong> usa IntelliJ, Eclipse ou VS Code, mas percebe os comandos básicos.</li>
          <li><strong>Prioridade para exame:</strong> tipos, controlo de fluxo, arrays, strings, classes, herança, interfaces, exceções, collections e generics.</li>
        </ul>`},
      {type:"callout", tone:"good", html:"Plano prático: 60% do tempo a programar, 25% a rever teoria, 15% a fazer testes curtos. Sempre que errares, escreve a regra no bloco de notas."},
      {type:"code", title:"Main.java", code:`public class Main {
    public static void main(String[] args) {
        System.out.println("Olá, Java!");
    }
}`},
      {type:"table", rows:[
        ["JDK", "Kit para desenvolver: compilador, runtime e ferramentas."],
        ["JRE", "Ambiente para executar programas Java. Hoje vem normalmente dentro do JDK."],
        ["JVM", "Máquina virtual que executa bytecode."],
        ["Bytecode", "Código intermédio .class, portável entre sistemas com JVM."],
        ["Classe pública", "Se a classe é public, o ficheiro tem de ter o mesmo nome."]
      ]},
      {type:"exercise", id:"ex-plano", prompt:"Escreve uma classe chamada Main que imprime o teu nome e o nome da cadeira.", starter:`public class Main {
    public static void main(String[] args) {
        // escreve aqui
    }
}`, checks:[
        {re:"public\\s+class\\s+Main", msg:"A classe deve chamar-se Main."},
        {re:"public\\s+static\\s+void\\s+main\\s*\\(", msg:"Falta o método main."},
        {re:"System\\.out\\.println", msg:"Usa System.out.println para imprimir."}
      ], hint:"Dentro do main escreve System.out.println(\"...\");"}
    ],
    quiz: {
      q: "Porque é que Java é considerado portável?",
      options: ["Porque o bytecode corre numa JVM em vários sistemas.", "Porque não precisa de compilação.", "Porque só funciona em browsers.", "Porque todos os ficheiros Java são iguais."],
      answer: 0,
      explain: "O código Java é compilado para bytecode, e a JVM interpreta/executa esse bytecode no sistema onde estiver instalada."
    }
  },
  {
    id: "sintaxe",

          <li><code>filter</code>: fica só com elementos que cumprem uma condição.</li>

      {type:"code", title:"Stream pipeline", code:`record Aluno(String nome, double media) {}

    new Aluno("Ana", 16),
    new Aluno("Rui", 8),
    new Aluno("Mia", 14)
);

List<String> aprovados = alunos.stream()
    .filter(a -> a.media() >= 9.5)
    .map(Aluno::nome)
    .sorted()

let state = JSON.parse(localStorage.getItem("javadex-state") || "{}");
state.done = state.done || [];
state.checks = state.checks || {};
state.current = state.current || lessons[0].id;
let flashIndex = Number(localStorage.getItem("javadex-flash") || "0");

function save() {
  localStorage.setItem("javadex-state", JSON.stringify(state));
  updateProgress();
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function renderSidebar(filter = "") {
  const sidebar = document.getElementById("sidebar");
  const modules = [...new Set(lessons.map(l => l.module))];
  const f = filter.trim().toLowerCase();
  let html = `<div class="side-title">Percurso Java</div>
    <button class="nav-item ${state.current === "dashboard" ? "active" : ""}" onclick="showDashboard()">Visão geral <small>início</small></button>`;

  for (const mod of modules) {
    const items = lessons.filter(l => l.module === mod && matches(l, f));
    if (!items.length) continue;
    html += `<div class="side-title">${mod}</div>`;
    for (const lesson of items) {
      html += `<button class="nav-item ${state.current === lesson.id ? "active" : ""} ${state.done.includes(lesson.id) ? "done" : ""}" onclick="openLesson('${lesson.id}')">
        <span>${lesson.title}</span><small>${lesson.minutes}m</small>
      </button>`;
    }
  }

  if (!lessons.some(l => matches(l, f))) {
    html += `<div class="empty">Nada encontrado. Experimenta "String", "Map", "POO" ou "exceções".</div>`;
  }
  sidebar.innerHTML = html;
}

function matches(lesson, f) {
  if (!f) return true;
  const hay = [lesson.title, lesson.module, lesson.summary, lesson.level, JSON.stringify(lesson.body)].join(" ").toLowerCase();
  return hay.includes(f);
}

function showDashboard() {
  state.current = "dashboard";
  save();
  renderSidebar(document.getElementById("search").value);
  const total = lessons.length;
  const done = state.done.length;
  const phases = [
    ["1", "Base da linguagem", "Começa por sintaxe, tipos, condições, ciclos e métodos."],
    ["2", "Dados e algoritmos", "Treina arrays, Strings, percursos, pesquisas e acumuladores."],
    ["3", "POO a sério", "Consolida classes, objetos, encapsulamento, herança e interfaces."],
    ["4", "Exame", "Resolve exercícios completos, revê erros e treina no papel."]
  ].map(p => `<article class="phase-card">
    <small>Fase ${p[0]}</small>
    <strong>${p[1]}</strong>
    <p>${p[2]}</p>
  </article>`).join("");
  const byModule = [...new Set(lessons.map(l => l.module))].map(module => {
    const group = lessons.filter(l => l.module === module);
    const completed = group.filter(l => state.done.includes(l.id)).length;
    const pct = Math.round((completed / group.length) * 100);
    return `<article class="module-card">
      <strong>${module}</strong>
      <span>${completed}/${group.length} lições concluídas</span>
      <span>${group.map(l => l.title).join(", ")}</span>
      <div class="meter"><i style="width:${pct}%"></i></div>
    </article>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <section class="hero">
      <div class="kicker">Estudo prático de Java</div>
      <h1>O essencial para aprender Java e chegar ao exame com confiança.</h1>
      <p>Este site junta teoria direta, exemplos pequenos, armadilhas de exame, exercícios validados no browser, quizzes e uma checklist. A ideia é estudares quase tudo aqui e depois praticares em IDE.</p>
      <div class="hero-actions">
        <button class="btn primary" onclick="openLesson('${firstUnfinished().id}')">Continuar estudo</button>
        <button class="btn" onclick="openLesson('exame')">Treino de exame</button>
        <button class="btn" onclick="markAllExam()">Marcar tópicos de exame</button>
      </div>
    </section>
    <section class="section">
      <h2>Ordem ideal de estudo</h2>
      <div class="phase-grid">${phases}</div>
    </section>
    <section class="section">
      <h2>Roteiro recomendado</h2>
      <div class="module-grid">${byModule}</div>
    </section>
    <section class="section">
      <h2>Como usar este site</h2>
      <div class="text-block">
        <ol>
          <li>Faz as lições pela ordem. Se já souberes um tópico, faz o quiz e o exercício.</li>
          <li>Quando errares, escreve uma nota curta: regra, exemplo e erro que cometeste.</li>
          <li>No fim, abre "Treino de exame" e resolve sem copiar.</li>
          <li>Na IDE, cria um ficheiro pequeno por tópico e compila mesmo.</li>
        </ol>
        <p><strong>Progresso atual:</strong> ${done}/${total} lições concluídas.</p>
      </div>
    </section>`;
}

function firstUnfinished() {
  return lessons.find(l => !state.done.includes(l.id)) || lessons[lessons.length - 1];
}

function openLesson(id) {
  const lesson = lessons.find(l => l.id === id);
  if (!lesson) return;
  state.current = id;
  save();
  renderSidebar(document.getElementById("search").value);
  document.getElementById("sidebar").classList.remove("open");
  const index = lessons.findIndex(l => l.id === id);
  const prev = lessons[index - 1];
  const next = lessons[index + 1];

  document.getElementById("main").innerHTML = `
    <article class="lesson-card">
      <div class="lesson-meta">
        <span class="tag">${lesson.module}</span>
        <span class="tag">${lesson.level}</span>
        <span class="tag">${lesson.minutes} min</span>
        ${lesson.exam ? `<span class="tag exam">sai muito em exame</span>` : `<span class="tag">extra útil</span>`}
      </div>
      <h1>${lesson.title}</h1>
      <p style="color:var(--muted); margin-top:10px">${lesson.summary}</p>
      ${renderLessonPlan(lesson)}
      <div class="lesson-body" style="margin-top:22px">${renderLessonSections(lesson)}</div>
      ${renderQuiz(lesson)}
      <div class="lesson-nav">
        <button class="btn" ${prev ? `onclick="openLesson('${prev.id}')"` : "disabled"}>Anterior</button>
        <button class="btn good" onclick="completeLesson('${lesson.id}')">${state.done.includes(lesson.id) ? "Concluída" : "Marcar como concluída"}</button>
        <button class="btn primary" ${next ? `onclick="openLesson('${next.id}')"` : `onclick="showDashboard()"`}>${next ? "Seguinte" : "Voltar ao início"}</button>
      </div>
    </article>`;
  window.scrollTo({top: 0, behavior: "smooth"});
}

function renderLessonPlan(lesson) {
  const items = [
    "Lê a ideia principal",
    "Estuda o exemplo",
    "Decora as armadilhas",
    "Resolve o exercício",
    "Faz o quiz"
  ];
  return `<div class="lesson-intro">
    <strong>Como estudar esta lição</strong>
    <ul class="lesson-map">${items.map(item => `<li>${item}</li>`).join("")}</ul>
  </div>`;
}

function renderLessonSections(lesson) {
  return lesson.body.map((block, index) => {
    const meta = sectionMeta(block.type);
    return `<section class="lesson-section">
      <div class="lesson-section-head">
        <span class="lesson-section-num">${index + 1}</span>
        <div>
          <div class="lesson-section-title">${meta.title}</div>
          <div class="lesson-section-desc">${meta.desc}</div>
        </div>
      </div>
      <div class="lesson-section-body">${renderBlock(block)}</div>
    </section>`;
  }).join("");
}

function sectionMeta(type) {
  const labels = {
    text: ["Teoria essencial", "Percebe a regra antes de decorar o código."],
    callout: ["Atenção para exame", "Dica, armadilha ou regra que costuma fazer perder pontos."],
    code: ["Exemplo em Java", "Lê linha a linha e tenta alterar valores."],
    table: ["Resumo organizado", "Compara conceitos e guarda as diferenças principais."],
    exercise: ["Prática guiada", "Escreve, verifica, corrige e depois tenta de novo sem ajuda."]
  };
  const found = labels[type] || ["Secção", "Estuda esta parte com calma."];
  return { title: found[0], desc: found[1] };
}

function renderBlock(block) {
  if (block.type === "text") return `<div class="text-block">${block.html}</div>`;
  if (block.type === "callout") return `<div class="callout ${block.tone || ""}">${block.html}</div>`;
  if (block.type === "table") {
    return `<table class="compare"><tbody>${block.rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</tbody></table>`;
  }
  if (block.type === "code") {
    return `<div class="codebox">
      <div class="code-head"><span>${block.title}</span><button onclick="copyCode(this)">copiar</button></div>
      <pre>${escapeHtml(block.code)}</pre>
    </div>`;
  }
  if (block.type === "exercise") {
    return `<section class="exercise-card">
      <h3>Exercício prático</h3>
      <p>${block.prompt}</p>
      <textarea id="${block.id}" spellcheck="false">${escapeHtml(block.starter)}</textarea>
      <div class="exercise-actions">
        <button class="btn good" onclick="checkExercise('${block.id}')">Verificar</button>
        <button class="btn" onclick="showHint('${block.id}')">Dica</button>
        <button class="btn" onclick="resetExercise('${block.id}')">Repor</button>
      </div>
      <div class="result" id="${block.id}-result"></div>
    </section>`;
  }
  return "";
}

function renderQuiz(lesson) {
  const q = lesson.quiz;
  return `<section class="lesson-section" style="margin-top:14px">
    <div class="lesson-section-head">
      <span class="lesson-section-num">Q</span>
      <div>
        <div class="lesson-section-title">Quiz rápido</div>
        <div class="lesson-section-desc">Confirma se percebeste antes de seguir.</div>
      </div>
    </div>
    <div class="lesson-section-body">
      <section class="quiz-card">
        <h3>Pergunta de revisão</h3>
        <p>${q.q}</p>
        <div class="quiz-options">
          ${q.options.map((opt, i) => `<button class="option" onclick="answerQuiz('${lesson.id}', ${i})">${opt}</button>`).join("")}
        </div>
        <div class="feedback" id="quiz-${lesson.id}"></div>
      </section>
    </div>
  </section>`;
}

function findExercise(id) {
  for (const lesson of lessons) {
    const found = lesson.body.find(b => b.type === "exercise" && b.id === id);
    if (found) return found;
  }
}

function checkExercise(id) {
  const ex = findExercise(id);
  const code = document.getElementById(id).value;
  const result = document.getElementById(id + "-result");
  result.removeAttribute("style");
  const missing = ex.checks.filter(c => !(new RegExp(c.re, "is").test(code)));
  if (missing.length) {
    result.className = "result show no";
    result.innerHTML = `<strong>Ainda falta:</strong><ul>${missing.map(m => `<li>${m.msg}</li>`).join("")}</ul>`;
  } else {
    result.className = "result show ok";
    result.innerHTML = "Boa. A solução cumpre os requisitos principais. Agora tenta compilar numa IDE e testar com mais casos.";
  }
}

function showHint(id) {
  const ex = findExercise(id);
  const result = document.getElementById(id + "-result");
  result.className = "result show hint";
  result.removeAttribute("style");
  result.textContent = ex.hint;
}

function resetExercise(id) {
  const ex = findExercise(id);
  document.getElementById(id).value = ex.starter;
  const result = document.getElementById(id + "-result");
  result.className = "result";
  result.removeAttribute("style");
  result.textContent = "";
}

function answerQuiz(lessonId, selected) {
  const lesson = lessons.find(l => l.id === lessonId);
  const buttons = document.querySelectorAll(".quiz-options .option");
  buttons.forEach((btn, i) => {
    btn.classList.remove("correct", "wrong");
    if (i === lesson.quiz.answer) btn.classList.add("correct");
    if (i === selected && selected !== lesson.quiz.answer) btn.classList.add("wrong");
  });
  const ok = selected === lesson.quiz.answer;
  document.getElementById("quiz-" + lessonId).innerHTML = `<strong>${ok ? "Certo." : "Quase."}</strong> ${lesson.quiz.explain}`;
}

function completeLesson(id) {
  if (!state.done.includes(id)) {
    state.done.push(id);
    save();
  }
  openLesson(id);
}

function copyCode(btn) {
  const text = btn.closest(".codebox").querySelector("pre").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.textContent = "copiado";
    setTimeout(() => btn.textContent = old, 1100);
  });
}

function renderChecklist() {
  document.getElementById("examChecklist").innerHTML = checklist.map((item, i) => `
    <li><input type="checkbox" ${state.checks[i] ? "checked" : ""} onchange="toggleCheck(${i}, this.checked)"><span>${item}</span></li>
  `).join("");
}

function toggleCheck(i, checked) {
  state.checks[i] = checked;
  save();
}

function renderFlash() {
  const card = flashcards[flashIndex % flashcards.length];
  document.getElementById("flashcard").classList.remove("reveal");
  document.getElementById("flashcard").innerHTML = `<strong>${card[0]}</strong><div class="flash-answer">${card[1]}</div>`;
  localStorage.setItem("javadex-flash", flashIndex);
}

function revealFlash() {
  document.getElementById("flashcard").classList.add("reveal");
}

function nextFlash() {
  flashIndex = (flashIndex + 1) % flashcards.length;
  renderFlash();
}

function updateProgress() {
  const pct = Math.round((state.done.length / lessons.length) * 100);
  document.getElementById("progressChip").textContent = `${pct}% concluído`;
}

function updateThemeButton() {
  const isDark = document.documentElement.dataset.theme === "dark";
  document.getElementById("themeBtn").textContent = isDark ? "Modo claro" : "Modo escuro";
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("javadex-theme", next);
  updateThemeButton();
}

function resetProgress() {
  if (!confirm("Queres mesmo limpar progresso, checklist e notas?")) return;
  state = {done: [], checks: {}, current: "dashboard"};
  localStorage.removeItem("javadex-notes");
  document.getElementById("notes").value = "";
  save();
  renderChecklist();
  showDashboard();
}

function markAllExam() {
  lessons.filter(l => l.exam).forEach(l => {
    if (!state.done.includes(l.id)) state.done.push(l.id);
  });
  save();
  showDashboard();
}

document.getElementById("search").addEventListener("input", e => {
  renderSidebar(e.target.value);
});

document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});

document.getElementById("notes").value = localStorage.getItem("javadex-notes") || "";
document.getElementById("notes").addEventListener("input", e => {
  localStorage.setItem("javadex-notes", e.target.value);
});

renderChecklist();
renderFlash();
updateProgress();
updateThemeButton();
renderSidebar();
if (state.current && state.current !== "dashboard" && lessons.some(l => l.id === state.current)) {
  openLesson(state.current);
} else {
  showDashboard();
}
</script>
</body>
</html>
